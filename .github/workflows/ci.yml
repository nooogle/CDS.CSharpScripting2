name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest   # net48 + net10.0-windows targets require Windows

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # MinVer needs full history to compute version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --verbosity normal

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # Scoped to UnitTests specifically: it's the classic VSTest-based project. UITests uses
        # Microsoft.Testing.Platform (MTP), which dotnet test/VSTest can no longer run at all on
        # the .NET 10 SDK, and it drives a real WinForms UI via FlaUI rather than being a
        # headless suite — not (yet) wired into unattended CI.
        run: dotnet test UnitTests/UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0   # no floating v5 tag upstream — pin exact, verify with git ls-remote before bumping
