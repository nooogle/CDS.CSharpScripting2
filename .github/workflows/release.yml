name: Release

on:
  push:
    tags:
      - 'V*.*.*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      id-token: write             # required for NuGet OIDC trusted publishing + attestations
      contents: write             # required for creating GitHub Releases
      attestations: write         # required for SBOM + build provenance attestations

    environment: nuget

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # Scoped to UnitTests specifically: it's the classic VSTest-based project. UITests uses
        # Microsoft.Testing.Platform (MTP), which dotnet test/VSTest can no longer run at all on
        # the .NET 10 SDK, and it drives a real WinForms UI via FlaUI rather than being a
        # headless suite — not (yet) wired into unattended CI.
        run: dotnet test UnitTests/UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Pack CDS.CSharpScript2
        run: dotnet pack CDS.CSharpScript2/CDS.CSharpScript2.csproj --no-build --configuration Release --output ./artifacts

      - name: Pack CDS.CSharpScript2.ScintillaEditor
        run: dotnet pack CDS.CSharpScript2.ScintillaEditor/CDS.CSharpScript2.ScintillaEditor.csproj --no-build --configuration Release --output ./artifacts

      - name: Generate SBOMs
        run: |
          dotnet tool install --global CycloneDX

          # dotnet-CycloneDX inspects the dependency graph, not the MinVer-computed
          # package version, and defaults metadata.component.version to 0.0.0 unless
          # told otherwise — pull the real version back out of the .nupkg filename.
          $csVersion = (Get-ChildItem -Path ./artifacts -Filter "*.nupkg" | Where-Object { $_.BaseName -match '^CDS\.CSharpScript2\.\d' } | Select-Object -First 1).BaseName.Substring('CDS.CSharpScript2.'.Length)
          $scintillaVersion = (Get-ChildItem -Path ./artifacts -Filter "*.nupkg" | Where-Object { $_.BaseName -match '^CDS\.CSharpScript2\.ScintillaEditor\.\d' } | Select-Object -First 1).BaseName.Substring('CDS.CSharpScript2.ScintillaEditor.'.Length)

          dotnet-CycloneDX CDS.CSharpScript2/CDS.CSharpScript2.csproj -o ./artifacts -F json -fn bom-CDS.CSharpScript2.json -sv $csVersion
          dotnet-CycloneDX CDS.CSharpScript2.ScintillaEditor/CDS.CSharpScript2.ScintillaEditor.csproj -o ./artifacts -F json -fn bom-CDS.CSharpScript2.ScintillaEditor.json -sv $scintillaVersion

      # actions/attest-build-provenance and actions/attest-sbom are both now thin wrappers over
      # actions/attest (which auto-detects provenance vs. SBOM mode from whether sbom-path is
      # set) - attest-sbom specifically logs a runtime deprecation warning, so all three steps
      # below use the unified action directly instead.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./artifacts/*.nupkg

      - name: Attest SBOM — CDS.CSharpScript2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./artifacts/CDS.CSharpScript2.*.nupkg
          sbom-path: ./artifacts/bom-CDS.CSharpScript2.json

      - name: Attest SBOM — CDS.CSharpScript2.ScintillaEditor
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./artifacts/CDS.CSharpScript2.ScintillaEditor.*.nupkg
          sbom-path: ./artifacts/bom-CDS.CSharpScript2.ScintillaEditor.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/bom-*.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate with NuGet (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-auth
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        run: |
          foreach ($pkg in Get-ChildItem -Path ./artifacts -Filter "*.nupkg") {
            dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} --skip-duplicate
          }

      - name: Push symbol packages to NuGet.org
        run: |
          foreach ($pkg in Get-ChildItem -Path ./artifacts -Filter "*.snupkg") {
            dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} --skip-duplicate
          }
